<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 25 XMF Reader - Tire & Engine Data</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f1419 0%, #1a1f2e 100%);
            color: #e0e0e0;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px 0;
            border-bottom: 2px solid #ff1e26;
        }

        h1 {
            color: #ff1e26;
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #b0b0b0;
            font-size: 1.1em;
        }

        .upload-section {
            background: rgba(255, 30, 38, 0.1);
            border: 2px dashed #ff1e26;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
            margin-bottom: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-section:hover {
            background: rgba(255, 30, 38, 0.15);
            border-color: #ff4444;
        }

        .upload-section input {
            display: none;
        }

        .upload-label {
            cursor: pointer;
            display: inline-block;
        }

        .upload-label:hover {
            color: #ff1e26;
        }

        .files-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .file-card {
            background: rgba(255, 255, 255, 0.05);
            border-left: 4px solid #ff1e26;
            border-radius: 8px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .file-card:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
        }

        .file-card.active {
            background: rgba(255, 30, 38, 0.2);
            border-left-color: #ffaa00;
        }

        .file-card h3 {
            color: #ff1e26;
            margin-bottom: 5px;
            font-size: 1em;
        }

        .file-card p {
            font-size: 0.9em;
            color: #909090;
        }

        .file-card .remove {
            color: #ff6666;
            cursor: pointer;
            font-size: 0.85em;
            margin-top: 10px;
        }

        .file-card .remove:hover {
            color: #ff1e26;
        }

        .data-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(255, 30, 38, 0.3);
        }

        .section-title {
            color: #ff1e26;
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 30, 38, 0.5);
            padding-bottom: 10px;
        }

        .data-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .data-item {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 30, 38, 0.2);
            border-radius: 6px;
            padding: 12px;
        }

        .data-item label {
            display: block;
            color: #ffaa00;
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .data-item value {
            display: block;
            font-size: 1.2em;
            color: #e0e0e0;
            font-weight: 500;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 30, 38, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            height: 400px;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .table-container {
            overflow-x: auto;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: rgba(255, 30, 38, 0.2);
            color: #ff1e26;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            border-bottom: 2px solid #ff1e26;
        }

        td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 30, 38, 0.1);
        }

        tr:hover {
            background: rgba(255, 30, 38, 0.05);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            background: #ff1e26;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        button:hover {
            background: #ff4444;
            transform: translateY(-2px);
        }

        button.secondary {
            background: rgba(255, 30, 38, 0.2);
            color: #ff1e26;
            border: 1px solid #ff1e26;
        }

        button.secondary:hover {
            background: rgba(255, 30, 38, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #909090;
        }

        .empty-state p {
            font-size: 1.1em;
            margin-bottom: 10px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid rgba(255, 30, 38, 0.2);
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #b0b0b0;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #ff1e26;
            border-bottom-color: #ff1e26;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .comparison-table {
            font-size: 0.9em;
        }

        .comparison-table th {
            position: sticky;
            top: 0;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 1.8em;
            }

            .files-list {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏎️ F1 25 XMF Reader</h1>
            <p class="subtitle">Tire & Engine Data Analysis</p>
        </header>

        <div class="upload-section">
            <label class="upload-label">
                <input type="file" id="fileInput" accept=".xmf,.xml" multiple>
                <span>📁 Click to upload XMF files or drag & drop</span>
            </label>
        </div>

        <div id="filesList" class="files-list"></div>

        <div id="content">
            <div class="empty-state">
                <p>No files loaded yet</p>
                <p>Upload XMF files to get started</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
